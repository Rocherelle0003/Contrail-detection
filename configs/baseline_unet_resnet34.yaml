# Baseline Phase 2 — U-Net avec encodeur ResNet34 pré-entraîné ImageNet (segmentation-models-pytorch),
# entrée Ash RGB, frame cible uniquement.
name: baseline_unet_resnet34
model: unet_resnet34
in_channels: 3

seed: 42
epochs: 60
batch_size: 2
lr: 0.0001
dice_weight: 0.5
threshold: 0.5

data_dir: Data/Raw/opencontrails_mini_sample
checkpoint_dir: checkpoints
reports_dir: reports
